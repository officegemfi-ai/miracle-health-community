# The Library watch: every Monday, an agent searches PubMed for studies in people of each Library
# compound (and of the drug it's part of) that report an effect on a blood marker and that its fact
# sheet doesn't cite yet (scripts/library_watch.py, with the list in the site's
# library/data/watch.json). Claude reads each abstract for which marker moved which way, in whom.
# They go to one issue to review ("Library watch: studies to review"): nothing reaches a fact sheet,
# Sig or the screen from here until an editor adds it. Run it by hand with "every year" to go back
# through everything PubMed has, not just what it added lately.
name: Library watch

on:
  schedule:
    - cron: '41 10 * * 1'
  workflow_dispatch:
    inputs:
      backfill:
        description: Every year, not just what PubMed added in the last 45 days
        type: boolean
        default: false
      only:
        description: Only these compounds (Library ids, comma-separated)
        type: string
        default: ''
      show:
        description: Just print these PubMed ids' abstracts (comma-separated), to check a study
        type: string
        default: ''

permissions:
  contents: read
  issues: write

concurrency: library-watch

jobs:
  watch:
    name: Studies to review
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: officegemfi-ai/miraclehealth-site
          path: site
      - name: Search PubMed and read what's new
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BACKFILL: ${{ inputs.backfill }}
          ONLY: ${{ inputs.only }}
          SHOW: ${{ inputs.show }}
        run: |
          args=(--site site --out "$RUNNER_TEMP/watch" --issue)
          if [ "$BACKFILL" = true ]; then args+=(--backfill); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$SHOW" ]; then args=(--site site --show "$SHOW"); fi
          python3 scripts/library_watch.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-watch
          path: ${{ runner.temp }}/watch
          if-no-files-found: ignore

# Runs on every change: the access tests, Supabase's security checks, the server
# function tests and a real browser going through the whole community flow.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  functions:
    name: Rules copies and server functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check_rules_sync.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno test --allow-env supabase/functions
  database:
    name: Access tests, security lints, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a local Supabase (Docker)
        run: supabase start -x studio,imgproxy,logflare,vector
      - name: Turn GraphQL off, as in the live project
        run: psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -c "drop extension if exists pg_graphql cascade"
      - name: Access tests (pgTAP)
        run: supabase test db
      - name: Security lints (the Security Advisor's checks)
        run: scripts/security_lints.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: End-to-end in a real browser
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" ENVIRONMENT=ci
          scripts/build_web.sh _site_ci
          npm ci --prefix tests/e2e
          npx --prefix tests/e2e playwright install --with-deps chromium
          (cd _site_ci && python3 -m http.server 4173 >/dev/null 2>&1 &)
          sleep 1
          BASE_URL=http://127.0.0.1:4173/ DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres" node tests/e2e/flow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/out

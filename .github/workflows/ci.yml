# Runs on every change: the access tests, Supabase's security checks, the server
# function tests and a real browser going through the whole community flow.
# Once Supabase is up, every check runs even if an earlier one fails, and each
# failure leaves a readable note (annotation) on the run's summary page.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  functions:
    name: Rules copies and server functions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rules copies match
        run: |
          set -o pipefail
          scripts/check_rules_sync.sh 2>&1 | tee "$RUNNER_TEMP/rules.log" \
            || { scripts/ci_annotate.sh "Rules copies" "$RUNNER_TEMP/rules.log"; exit 1; }
      - name: Design kit copies match (the app's and the website's)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          scripts/check_kit_sync.sh 2>&1 | tee "$RUNNER_TEMP/kit.log" \
            || { scripts/ci_annotate.sh "Design kit copies" "$RUNNER_TEMP/kit.log"; exit 1; }
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Server function tests (Deno)
        run: |
          set -o pipefail
          deno test --allow-env supabase/functions 2>&1 | tee "$RUNNER_TEMP/deno.log" \
            || { scripts/ci_annotate.sh "Server function tests" "$RUNNER_TEMP/deno.log"; exit 1; }
  database:
    name: Access tests, security lints, end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start a local Supabase (Docker)
        id: start
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,logflare,vector 2>&1 | tee "$RUNNER_TEMP/start.log" \
            || { scripts/ci_annotate.sh "Supabase start" "$RUNNER_TEMP/start.log"; exit 1; }
      - name: Turn GraphQL off, as in the live project
        id: graphql
        run: psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -c "drop extension if exists pg_graphql cascade"
      - name: Access tests (pgTAP)
        if: always() && steps.start.outcome == 'success'
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee "$RUNNER_TEMP/pgtap.log" \
            || { scripts/ci_annotate.sh "Access tests" "$RUNNER_TEMP/pgtap.log"; exit 1; }
      - name: Security lints (the Security Advisor's checks)
        if: always() && steps.graphql.outcome == 'success'
        run: |
          set -o pipefail
          scripts/security_lints.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres" 2>&1 | tee "$RUNNER_TEMP/lints.log" \
            || { scripts/ci_annotate.sh "Security lints" "$RUNNER_TEMP/lints.log"; exit 1; }
      - uses: actions/setup-node@v4
        if: always() && steps.start.outcome == 'success'
        with:
          node-version: 22
      - name: End-to-end in a real browser
        if: always() && steps.start.outcome == 'success'
        run: |
          set -o pipefail
          timeout 1200 scripts/ci_e2e.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log" \
            || { scripts/ci_annotate.sh "End-to-end" "$RUNNER_TEMP/e2e.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/out
          if-no-files-found: ignore

# Health check: every six hours, checks what visitors and members rely on is up, and fails (so
# GitHub emails you) when something isn't. The only thing it may change: it starts the site build.
#   - miraclehealth.us and its Library, and community.miraclehealth.us, answer
#   - the community's public numbers (snapshot.json) are current. GitHub runs scheduled jobs late
#     at busy times (the hourly site build has come every four to eight hours), so when they're
#     over three hours old it starts the build (Pages) itself, with a note; it fails only when
#     they're over twelve hours old, or when the last build failed
#   - the Signal API (the signal function) answers, and the database's minute job checked its numbers
#     in the last five minutes (when the job stops, the API publishes in its place and says so)
#   - the evidence files the Library reads are there
#   - Sig's chat and the weekly email sign-up answer from miraclehealth.us
name: Health check
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write   # to start the site build when the numbers are stale
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://miraclehealth.us
      COMMUNITY: https://community.miraclehealth.us
      FUNCTIONS: https://nerfymdslkhopsomwriv.supabase.co/functions/v1
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the sites and the server functions
        run: |
          fail=0
          bad() { echo "::error title=Health check::$1"; fail=1; }
          page() {  # a page answers 200 and has the words it should
            body="$(curl -fsSL --max-time 30 "$1")" || { bad "$1 didn't answer"; return; }
            grep -q "$2" <<<"$body" || bad "$1 answered, but without \"$2\""
          }
          page "$SITE/" "Miracle Health"
          page "$SITE/library/" "Library"
          page "$SITE/library/bpc157/" "BPC-157"
          page "$SITE/ai/" "Ask Sig"
          page "$COMMUNITY/" "Miracle Health"

          snap="$(curl -fsS --max-time 30 "$COMMUNITY/snapshot.json")" || bad "snapshot.json didn't answer"
          if [ -n "${snap:-}" ]; then
            at="$(jq -r '.checked_at // .generated_at // empty' <<<"$snap")"
            if [ -z "$at" ]; then bad "snapshot.json has no generated_at"
            else
              age=$(( $(date -u +%s) - $(date -u -d "$at" +%s) ))
              echo "snapshot.json is $((age / 60)) minutes old, with $(jq '.signals | length' <<<"$snap") Signals"
              if [ "$age" -ge 10800 ]; then
                # GitHub runs the hourly build late at busy times: start one now
                if gh workflow run pages.yml --ref main; then
                  echo "::notice title=Health check::The community's numbers were $((age / 3600)) hours old (GitHub ran the hourly build late), so a site build was started."
                else
                  bad "The community's numbers are $((age / 3600)) hours old, and the site build couldn't be started"
                fi
              fi
              [ "$age" -lt 43200 ] || bad "snapshot.json is $((age / 3600)) hours old: the site build hasn't run in twelve hours (Actions > Pages)"
            fi
          fi
          last="$(gh run list --workflow pages.yml --status completed --limit 1 --json conclusion,url --jq '.[0] | "\(.conclusion) \(.url)"' 2>/dev/null || true)"
          case "$last" in
            success*|cancelled*|"") ;;
            *) bad "The last site build didn't finish: ${last}" ;;
          esac
          curl -fsS --max-time 30 -o /dev/null "$COMMUNITY/evidence/bpc157.json" || bad "The evidence files (evidence/bpc157.json) aren't there"

          # The Signal API: its numbers were checked lately, and by the database's minute job
          sv="$(curl -sS --max-time 30 -w '\n%{http_code}' "$FUNCTIONS/signal/version" 2>/dev/null)" || sv=$'\n000'
          code="${sv##*$'\n'}"; sv="${sv%$'\n'*}"
          case "$code" in
            200)
              by="$(jq -r '.checked_by // empty' <<<"$sv")"
              sage=$(( $(date -u +%s) - $(date -u -d "$(jq -r '.checked_at' <<<"$sv")" +%s) ))
              echo "The Signal API: version $(jq -r '.version' <<<"$sv"), checked $((sage / 60)) minutes ago by $by"
              [ "$sage" -lt 300 ] || bad "The Signal's numbers were last checked $((sage / 60)) minutes ago (the signal function and the database's minute job)"
              [ "$by" != api ] || bad "The database's minute job (pg_cron, signal-publish) isn't running, so the Signal API is publishing in its place (Supabase > Integrations > Cron)"
              ;;
            404) echo "::notice title=Health check::The Signal API isn't on the live project yet: it comes with the next Promote to live." ;;
            *) bad "The Signal API (the signal function) answered $code" ;;
          esac

          for fn in ask newsletter; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X OPTIONS "$FUNCTIONS/$fn" \
              -H "Origin: $SITE" -H 'Access-Control-Request-Method: POST')" || code=000
            echo "$fn: $code"
            case "$code" in 2*) ;; *) bad "The $fn function answered $code from miraclehealth.us" ;; esac
          done
          exit "$fail"

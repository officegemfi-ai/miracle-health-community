# Builds the website at community.miraclehealth.us.
# Before the community opens: an "opening soon" page at the root, the test app at /test/
# (from main) and the preview with sample posts at /preview/.
# Once it's open (a commit is tagged "live" by Promote to live): the live app at the root,
# from that commit, and nothing else; the test app and the preview stay off the site.
# Called by the two deploy workflows, after the database is updated. It can also be run
# by hand (Actions > Pages > Run workflow), and it runs every hour so the public library's
# numbers (snapshot.json, read by miraclehealth.us/library) stay current.
# With the repository secret SITE_PASSWORD set, every app sits behind that password.
# Each app's public key comes from Supabase with the SUPABASE_ACCESS_TOKEN secret (or the
# TEST_/LIVE_SUPABASE_URL and _ANON_KEY variables, when set).
name: Pages
on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
# One site build at a time, so the newest finishes last
concurrency:
  group: pages-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The privacy notice and contact address the apps link to
      PRIVACY_URL: ${{ vars.PRIVACY_URL || 'https://miraclehealth.us/privacy' }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'hello@miraclehealth.us' }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is the community open?
        id: live
        run: |
          mkdir -p _site
          if git rev-parse -q --verify refs/tags/live >/dev/null; then
            echo "open=true" >> "$GITHUB_OUTPUT"
            echo "The community is open: the live app goes at the root, and nothing else."
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "Not open yet: an opening-soon page at the root, the test app and the preview."
          fi
      - name: Tools for the preview (the database that runs in the browser)
        if: steps.live.outputs.open != 'true'
        run: npm ci --prefix scripts/preview --no-audit --no-fund --loglevel=error
      - name: Test app at /test/ (main)
        if: steps.live.outputs.open != 'true'
        env:
          ENVIRONMENT: test
          TEST_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$TEST_SUPABASE_URL" ] && [ -n "$TEST_SUPABASE_ANON_KEY" ]; then
            export SUPABASE_URL="$TEST_SUPABASE_URL" SUPABASE_ANON_KEY="$TEST_SUPABASE_ANON_KEY"
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            if scripts/supabase_project.sh test keys > "$RUNNER_TEMP/test-keys.env"; then
              set -a; . "$RUNNER_TEMP/test-keys.env"; set +a
              echo "::add-mask::$SUPABASE_ANON_KEY"
            else
              echo "::warning title=Test app::Couldn't get the test project's public key, so /test/ shows the preview."
            fi
          fi
          if [ -n "${SUPABASE_URL:-}" ]; then
            echo "The test app runs on $SUPABASE_URL"
            scripts/build_web.sh _site/test
          else
            echo "The test project isn't connected yet: publishing the preview with sample posts at /test/."
            DEMO=1 ENVIRONMENT=preview scripts/build_web.sh _site/test
          fi
      - name: The preview with sample posts at /preview/
        if: steps.live.outputs.open != 'true'
        env:
          ENVIRONMENT: preview
        run: DEMO=1 scripts/build_web.sh _site/preview
      - name: Opening-soon page at the root
        if: steps.live.outputs.open != 'true'
        run: |
          cp site/soon.html _site/index.html
          cp site/soon.css web/favicon.svg _site/
          mkdir -p _site/fonts && cp web/fonts/unbounded.woff2 _site/fonts/
      - name: Live app at the root (the commit tagged "live")
        if: steps.live.outputs.open == 'true'
        env:
          ENVIRONMENT: live
          LIVE_SUPABASE_URL: ${{ vars.LIVE_SUPABASE_URL }}
          LIVE_SUPABASE_ANON_KEY: ${{ vars.LIVE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$LIVE_SUPABASE_URL" ] && [ -n "$LIVE_SUPABASE_ANON_KEY" ]; then
            export SUPABASE_URL="$LIVE_SUPABASE_URL" SUPABASE_ANON_KEY="$LIVE_SUPABASE_ANON_KEY"
          else
            scripts/supabase_project.sh live keys > "$RUNNER_TEMP/live-keys.env" \
              || { echo "::error title=Live app::Couldn't get the live project's public key"; exit 1; }
            set -a; . "$RUNNER_TEMP/live-keys.env"; set +a
            echo "::add-mask::$SUPABASE_ANON_KEY"
          fi
          echo "The live app runs on $SUPABASE_URL"
          git worktree add /tmp/live live
          (cd /tmp/live && scripts/build_web.sh "$GITHUB_WORKSPACE/_site")
      - name: The public library's numbers (snapshot.json)
        if: steps.live.outputs.open == 'true'
        run: |
          # Aggregate totals only (private.public_snapshot): Signals, levels, how reports went,
          # ratings by use, side effects once three reports mention them. No posts, no names.
          # The library at miraclehealth.us reads it from here.
          if scripts/supabase_project.sh live snapshot > "$RUNNER_TEMP/snapshot.json"; then
            cp "$RUNNER_TEMP/snapshot.json" _site/snapshot.json
            echo "snapshot.json: $(jq '.signals | length' _site/snapshot.json) Signals"
          else
            echo "::warning title=Library numbers::Couldn't make a new snapshot; keeping the one that's up."
            curl -fsS https://community.miraclehealth.us/snapshot.json -o _site/snapshot.json \
              || echo "::warning title=Library numbers::No snapshot to keep; the library shows its pages without live numbers."
          fi
          # No CNAME file: with a GitHub Actions deploy, the custom domain is set in
          # Settings > Pages, and GitHub ignores a CNAME file.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

# Builds the website: the live app at the root (from the commit tagged "live"), the
# test app at /test/ (from main) and the preview with sample posts at /preview/.
# Called by the two deploy workflows, after the database is updated.
# With the repository secret SITE_PASSWORD set, every app sits behind that password.
# It can also be run by hand (Actions > Pages > Run workflow).
# The test app runs on the project named in deploy/test.env; its public key comes
# from Supabase with the SUPABASE_ACCESS_TOKEN secret (or the TEST_SUPABASE_URL and
# TEST_SUPABASE_ANON_KEY variables, when set). Until then /test/ shows the preview too.
name: Pages
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools for the preview (the database that runs in the browser)
        run: npm ci --prefix scripts/preview --no-audit --no-fund --loglevel=error
      - name: Test app at /test/ (main)
        env:
          ENVIRONMENT: test
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEST_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          mkdir -p _site
          ref=$(sed -n 's/^SUPABASE_PROJECT_REF=//p' deploy/test.env | tr -d '[:space:]')
          if [ -n "$TEST_SUPABASE_URL" ] && [ -n "$TEST_SUPABASE_ANON_KEY" ]; then
            export SUPABASE_URL="$TEST_SUPABASE_URL" SUPABASE_ANON_KEY="$TEST_SUPABASE_ANON_KEY"
          elif [ -n "$ref" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            scripts/supabase_project.sh test keys > "$RUNNER_TEMP/test-keys.env"
            set -a; . "$RUNNER_TEMP/test-keys.env"; set +a
            echo "::add-mask::$SUPABASE_ANON_KEY"
          fi
          if [ -n "${SUPABASE_URL:-}" ]; then
            echo "The test app runs on $SUPABASE_URL"
            scripts/build_web.sh _site/test
          else
            echo "The test project isn't connected yet: publishing the preview with sample posts at /test/."
            DEMO=1 ENVIRONMENT=preview scripts/build_web.sh _site/test
          fi
      - name: The preview with sample posts at /preview/
        env:
          ENVIRONMENT: preview
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: DEMO=1 scripts/build_web.sh _site/preview
      - name: Live app at the root (tag "live")
        env:
          ENVIRONMENT: live
          SUPABASE_URL: ${{ vars.LIVE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.LIVE_SUPABASE_ANON_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          mkdir -p _site
          if git rev-parse -q --verify refs/tags/live >/dev/null; then
            git worktree add /tmp/live live
            (cd /tmp/live && scripts/build_web.sh "$GITHUB_WORKSPACE/_site/live-build")
            cp -R _site/live-build/. _site/ && rm -rf _site/live-build
          else
            # Until the first promotion: a branded "opening soon" page
            cp site/soon.html _site/index.html
            cp site/soon.css web/favicon.svg _site/
            mkdir -p _site/fonts && cp web/fonts/unbounded.woff2 _site/fonts/
          fi
          # No CNAME file: with a GitHub Actions deploy, the custom domain is set in
          # Settings > Pages, and GitHub ignores a CNAME file.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

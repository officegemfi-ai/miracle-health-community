# After CI passes on main: update the TEST Supabase project and the test app.
name: Deploy to test
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency: deploy-test
jobs:
  backend:
    # Skips quietly until the test project is connected (repository variable TEST_SUPABASE_URL)
    if: github.event.workflow_run.conclusion == 'success' && vars.TEST_SUPABASE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Database changes
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Function secrets
        run: |
          supabase secrets set --project-ref "$REF" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            REVIEW_SECRET="${{ secrets.REVIEW_SECRET }}" \
            MODERATION_MODEL="${{ vars.MODERATION_MODEL }}" \
            APP_ORIGINS="${{ vars.APP_ORIGINS }}"
      - name: Functions
        run: |
          supabase functions deploy review-content --no-verify-jwt --project-ref "$REF"
          supabase functions deploy delete-account --project-ref "$REF"
  site:
    needs: backend
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

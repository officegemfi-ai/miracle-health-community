# After CI passes on main: update the TEST Supabase project and the website, then check
# the test app end to end against the test project. The check builds the test app and
# serves it from the runner itself, so it doesn't need /test/ to be on the public site
# (it comes off once the community is live). It can also be run by hand (Actions >
# Deploy to test > Run workflow).
#
# It stays quiet until the test project is connected: deploy/test.env names the
# project (SUPABASE_PROJECT_REF) and the repository has these secrets:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, ANTHROPIC_API_KEY
# The ask function (Miracle AI's chat on the website) is asked three real questions when it
# changes (scripts/ask_smoke.py); its answers show on the run's summary page.
# Optional: REVIEW_SECRET (otherwise one is made and kept in the project's Vault),
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_VERIFY_SERVICE_SID (texts to real phones;
#   without them only the test numbers sign in), TURNSTILE_SECRET_KEY,
#   variables MODERATION_MODEL, APP_ORIGINS, ASK_ORIGINS, ASK_MODEL, ASK_FAST_MODEL,
#   ASK_FALLBACK_MODEL and ASK_EFFORT.
# Each failing step leaves a readable note on the run's summary page.
name: Deploy to test
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: deploy-test
jobs:
  check:
    name: Is the test project connected?
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      connected: ${{ steps.c.outputs.connected }}
      ref: ${{ steps.c.outputs.ref }}
      sha: ${{ steps.c.outputs.sha }}
      live: ${{ steps.c.outputs.live }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: c
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # The project: deploy/test.env names it, or the token finds miracle-health-test
          ref=""
          if [ -n "$TOKEN" ]; then
            ref=$(SUPABASE_ACCESS_TOKEN="$TOKEN" scripts/supabase_project.sh test ref 2> "$RUNNER_TEMP/ref.err") \
              || { echo "::warning title=Test project::$(head -c 500 "$RUNNER_TEMP/ref.err")"; ref=""; }
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Once the community is live, the site is the live app only, and only Promote to
          # live rebuilds it (a rebuild from here could race it and put back an older build)
          if git ls-remote --exit-code --tags origin refs/tags/live >/dev/null 2>&1; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi
          missing=""
          [ -n "$ref" ] || missing="$missing the test project (deploy/test.env, or a project named miracle-health-test that the token reaches),"
          [ -n "$TOKEN" ] || missing="$missing the SUPABASE_ACCESS_TOKEN secret,"
          [ -n "$PASSWORD" ] || missing="$missing the SUPABASE_DB_PASSWORD secret,"
          if [ -z "$missing" ]; then
            echo "connected=true" >> "$GITHUB_OUTPUT"
            echo "Deploying to the test project $ref"
          else
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Test project not connected::Skipping the deploy. Missing:${missing%,}."
          fi

  backend:
    name: Database, sign-in and functions
    needs: check
    if: needs.check.outputs.connected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ needs.check.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Link the project
        run: |
          set -o pipefail
          supabase link --project-ref "$REF" --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$RUNNER_TEMP/link.log" \
            || { scripts/ci_annotate.sh "Link the test project" "$RUNNER_TEMP/link.log"; exit 1; }
      - name: Database changes, and the test invites and moderator
        run: |
          set -o pipefail
          supabase db push --include-seed --yes --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$RUNNER_TEMP/push.log" \
            || { scripts/ci_annotate.sh "Database changes" "$RUNNER_TEMP/push.log"; exit 1; }
      - name: Sign-in settings, Vault and function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_SECRET: ${{ secrets.REVIEW_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          MODERATION_MODEL: ${{ vars.MODERATION_MODEL }}
          APP_ORIGINS: ${{ vars.APP_ORIGINS }}
          ASK_ORIGINS: ${{ vars.ASK_ORIGINS }}
          ASK_MODEL: ${{ vars.ASK_MODEL }}
          ASK_FAST_MODEL: ${{ vars.ASK_FAST_MODEL }}
          ASK_FALLBACK_MODEL: ${{ vars.ASK_FALLBACK_MODEL }}
          ASK_EFFORT: ${{ vars.ASK_EFFORT }}
        run: |
          set -o pipefail
          scripts/supabase_project.sh test setup 2>&1 | tee "$RUNNER_TEMP/setup.log" \
            || { scripts/ci_annotate.sh "Project settings" "$RUNNER_TEMP/setup.log"; exit 1; }
      - name: Functions
        run: |
          set -o pipefail
          { supabase functions deploy review-content --no-verify-jwt --project-ref "$REF" \
            && supabase functions deploy delete-account --project-ref "$REF" \
            && supabase functions deploy ask --no-verify-jwt --project-ref "$REF"; } 2>&1 | tee "$RUNNER_TEMP/functions.log" \
            || { scripts/ci_annotate.sh "Functions" "$RUNNER_TEMP/functions.log"; exit 1; }
      - name: Supabase's security advisor
        run: scripts/supabase_project.sh test advisors

  site:
    needs: [check, backend]
    if: needs.check.outputs.live != 'true'
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  ask:
    name: Miracle AI answers real questions (test project)
    needs: [check, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 2
      - name: Ask three questions (only when the chat changed, or when run by hand)
        env:
          URL: https://${{ needs.check.outputs.ref }}.supabase.co/functions/v1/ask
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$BY_HAND" != true ] && git diff --quiet HEAD~1 HEAD -- supabase/functions/ask scripts/ask_smoke.py supabase/migrations 2>/dev/null; then
            echo "The chat didn't change in this commit; skipping (each check costs a few cents of Claude)."
            exit 0
          fi
          set -o pipefail
          python3 scripts/ask_smoke.py "$URL" 2>&1 | tee "$RUNNER_TEMP/ask.log" \
            || { scripts/ci_annotate.sh "Miracle AI" "$RUNNER_TEMP/ask.log"; exit 1; }

  smoke:
    name: The test app, end to end
    needs: [check, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser
        run: |
          npm ci --prefix tests/e2e --no-audit --no-fund --loglevel=error
          npx --prefix tests/e2e playwright install --with-deps chromium > "$RUNNER_TEMP/pw.log" 2>&1 \
            || { tail -n 20 "$RUNNER_TEMP/pw.log"; exit 1; }
      - name: Build the test app and serve it here
        run: |
          scripts/supabase_project.sh test keys > "$RUNNER_TEMP/keys.env"
          set -a; . "$RUNNER_TEMP/keys.env"; set +a
          echo "::add-mask::$SUPABASE_ANON_KEY"
          ENVIRONMENT=test scripts/build_web.sh "$RUNNER_TEMP/site/test"
          # The test project's functions accept calls from this address (see supabase_project.sh)
          (cd "$RUNNER_TEMP/site" && nohup python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &)
          for _ in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:4173/test/ && break; sleep 0.5; done
          curl -fsS -o /dev/null http://127.0.0.1:4173/test/
      - name: Sign up with a test number, post, Miracle AI reads it, delete the account
        env:
          BASE_URL: http://127.0.0.1:4173/test/
          EXPECT_SUPABASE_URL: https://${{ needs.check.outputs.ref }}.supabase.co
        run: |
          set -o pipefail
          timeout 900 node tests/e2e/smoke.mjs 2>&1 | tee "$RUNNER_TEMP/smoke.log" \
            || { scripts/ci_annotate.sh "The test app" "$RUNNER_TEMP/smoke.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-app-screenshots
          path: tests/e2e/out
          if-no-files-found: ignore

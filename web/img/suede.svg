<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><!-- The community's ground: the website's suede (img/suede.svg, the Noise card), smoother at the owner's pick: a 0.5px blur and a gentler grain (slope .55, not .9) --><filter id="s" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="2" stitchTiles="stitch"/><feGaussianBlur stdDeviation=".5" edgeMode="wrap"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="0.55" intercept="0.225"/><feFuncG type="linear" slope="0.55" intercept="0.225"/><feFuncB type="linear" slope="0.55" intercept="0.225"/><feFuncA type="discrete" tableValues="1"/></feComponentTransfer></filter><rect width="200" height="200" filter="url(#s)"/></svg>